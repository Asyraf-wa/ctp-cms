name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.44
        env:
          MYSQL_DATABASE: ctp_testing
          MYSQL_USER: ctp
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, intl, zip, bcmath, gd, exif
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Build assets
        run: npm run build

      - name: Tests (Pest)
        run: php artisan test

  # T6.01 / ARCH §9: the host has no Node and may have no Composer, so the production branch carries
  # everything it needs: the source, vendor/ without dev packages, and the built public/build/.
  # Runs only after the tests pass, and only for pushes to main. cPanel pulls this branch (.cpanel.yml).
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, intl, zip, bcmath, gd, exif
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the release
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          npm ci
          npm run build

      # cPanel's clone of this branch IS the live app (docs/DEPLOY.md), so the history must be linear:
      # each release is a normal commit on top of the last one and the host can simply pull.
      - name: Push to the production branch
        run: |
          rm -rf node_modules public/hot
          # The host runs PHP 8.4 through this cPanel handler. It is committed here (not edited on the
          # server) so that pulling never meets a locally modified public/.htaccess.
          printf '\n# php -- BEGIN cPanel-generated handler, do not edit\n<IfModule mime_module>\n  AddHandler application/x-httpd-ea-php84 .php .php8 .phtml\n</IfModule>\n# php -- END cPanel-generated handler, do not edit\n' >> public/.htaccess

          git clone -q --branch production --single-branch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/prod
          rsync -a --delete --exclude='/.git' --exclude='/node_modules' ./ /tmp/prod/
          # The live site never runs the tests, and host malware scanners rewrite test fixtures (a dirty clone
          # blocks Update from Remote). rsync does not delete excluded paths, so remove the folder explicitly.
          rm -rf /tmp/prod/tests
          cd /tmp/prod
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # public/css, js and fonts are Filament's admin assets, published by `filament:upgrade` during composer install.
          git add -f vendor public/build public/css public/js public/fonts
          if git diff --cached --quiet; then echo "Nothing changed since the last release."; exit 0; fi
          git commit -q -m "Release ${GITHUB_SHA::7} from main"
          git push origin production
